name: Tests

on:
  push:
    branches:
      - main
      - pde
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Run tests
        run: python -m pytest -q
